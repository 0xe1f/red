<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RED launcher concepts</title>
<style>
  :root {
    --gallery: #e7e4de;
    --ink: #1c1916;
    --muted: #5e584f;
    --line: #cfc8bc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--gallery);
    color: var(--ink);
    font: 15px/1.4 "Segoe UI", "Helvetica Neue", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .gallery { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 8px; }
  .lede { margin: 0 0 18px; max-width: 68ch; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .controls .group { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: #f4f1eb; border: 1px solid var(--line); }
  .controls button, .linkish {
    border: 0; background: transparent; padding: 6px 10px; color: var(--ink);
  }
  .controls button[aria-pressed="true"] { background: var(--ink); color: #f7f4ee; }
  .rule {
    min-height: 2.8em; margin: 0 0 14px; color: var(--ink);
  }
  .frame-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .frame {
    position: relative; height: 800px; overflow: hidden; background: #fff;
    border: 1px solid #1c1916;
  }
  .frame.desktop { width: min(1120px, 100%); }
  .frame.phone { width: 390px; }
  .notes { margin-top: 16px; max-width: 72ch; }
  .notes h2 { font-size: 16px; margin: 0 0 6px; }
  .notes p { margin: 0 0 8px; }
  .toast {
    position: absolute; left: 12px; bottom: 12px; z-index: 8;
    background: #111; color: #fff; padding: 8px 10px; font-size: 13px;
  }
  .scrim, .drop {
    position: absolute; inset: 0; z-index: 7; display: grid; place-items: center;
    background: rgba(16, 16, 16, 0.45); color: #fff;
  }
  .drop .well, .scrim span {
    width: min(520px, 86%); height: 58%;
    border: 2px dashed #fff; display: grid; place-items: center; text-align: center; padding: 16px;
  }
  .scrim span { border: 0; height: auto; font-size: 18px; }
  .mock { height: 100%; min-height: 0; position: relative; }
  .mock button { background: transparent; border: 1px solid transparent; }
  .acct-wrap { position: relative; }
  .mock .menu { top: calc(100% + 4px); right: 0; }
  .mock .search, .mock .vol input { accent-color: currentColor; }
  .list { min-height: 0; overflow: auto; }
  .game { width: 100%; text-align: left; display: block; border: 0; border-bottom: 1px solid transparent; }
  .game .gt { display: flex; align-items: center; gap: 8px; }
  .game svg { flex: 0 0 auto; }
  .keys { font-size: 12px; padding: 6px 12px; }
  .sensor, .chip, .fam, .dropbtn { white-space: nowrap; }
  .menu { position: absolute; z-index: 6; min-width: 140px; padding: 4px; }
  .menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; }

  /* ---------- Rail ---------- */
  .mock.rail { background: #f3f4f6; color: #1a1d21; display: flex; flex-direction: column; }
  .mock.rail header, .mock.rail .body, .mock.rail .keys { background: #fff; }
  .mock.rail header { border-bottom: 1px solid #e5e7eb; position: relative; }
  .mock.rail .brand { color: #d21f2b; font-weight: 760; letter-spacing: 0.06em; font-size: 20px; }
  .mock.rail .kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }
  .mock.rail .now .title { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mock.rail.is-run .now .title { color: #d21f2b; font-weight: 700; }
  .mock.rail .search { border: 1px solid #d0d5dd; border-radius: 999px; padding: 7px 12px; background: #fff; }
  .mock.rail .vol { display: flex; align-items: center; gap: 6px; }
  .mock.rail .vol input { width: 90px; }
  .mock.rail .acct, .mock.rail .end, .mock.rail .replay button, .mock.rail .dropbtn, .mock.rail .sensor {
    border: 1px solid #d0d5dd; border-radius: 999px; padding: 6px 10px; background: #fff;
  }
  .mock.rail .replay { display: flex; gap: 4px; }
  .mock.rail .replay button.on { background: #111; color: #fff; border-color: #111; }
  .mock.rail .end { color: #d21f2b; border-color: #f0c2c2; }
  .mock.rail .menu { background: #fff; border: 1px solid #e5e7eb; }
  .mock.rail .body { min-height: 0; flex: 1; display: grid; }
  .mock.rail .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; padding: 10px 10px 4px; }
  .mock.rail .chip {
    display: flex; width: calc(100% - 16px); margin: 2px 8px; padding: 6px 10px;
    border-radius: 999px; border: 1px solid transparent; gap: 8px; align-items: center; text-align: left;
  }
  .mock.rail .chip .n { margin-left: auto; color: #8b93a2; font-size: 12px; }
  .mock.rail .chip.on { background: #111; color: #fff; }
  .mock.rail .chip.on .n { color: rgba(255,255,255,.75); }
  .mock.rail .hint { color: #6b7280; font-size: 12px; padding: 2px 12px 8px; }
  .mock.rail .sensor, .mock.rail .dropbtn { margin: 8px; }
  .mock.rail .listhead, .mock.rail .keys { color: #6b7280; font-size: 12px; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #eef0f3; }
  .mock.rail .pill { border: 1px solid #e5e7eb; border-radius: 999px; padding: 3px 8px; background: #fff; }
  .mock.rail .game { padding: 9px 12px; border-bottom-color: #eef0f3; background: #fff; }
  .mock.rail .game .meta, .mock.rail .game .sys { color: #6b7280; font-size: 12px; }
  .mock.rail .game .sys { color: #d21f2b; font-variant: small-caps; letter-spacing: 0.04em; }
  .mock.rail .game.run .gt { color: #d21f2b; font-weight: 700; }
  .mock.rail .game.kbd { background: #fff6e8; }
  .mock.rail .keys { border-top: 1px solid #e5e7eb; border-bottom: 0; }
  .frame.desktop .mock.rail header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
  .frame.desktop .mock.rail .now { min-width: 0; flex: 0 1 240px; }
  .frame.desktop .mock.rail header .replay { margin-left: auto; }
  .frame.desktop .mock.rail .search { width: 180px; flex: none; }
  .frame.desktop .mock.rail .body { grid-template-columns: 232px 1fr; }
  .frame.desktop .mock.rail aside { border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .frame.desktop .mock.rail .groups { overflow: auto; flex: 1; min-height: 0; }
  .frame.desktop .mock.rail aside > .dropbtn { margin-top: auto; }
  .mock.rail .chip { padding: 4px 10px; }
  .mock.rail .lbl { padding: 7px 10px 2px; }
  .frame.desktop .mock.rail .main { display: flex; flex-direction: column; min-height: 0; }
  .frame.phone .mock.rail header {
    display: grid; gap: 6px; padding: 8px; align-items: center;
  }
  .frame.phone .mock.rail.is-run header {
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "brand now end acct" "replay replay replay replay" "search search search search" "vol vol vol vol";
  }
  .frame.phone .mock.rail.is-idle header {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "brand now acct" "search search search" "vol vol vol";
  }
  .frame.phone .mock.rail .kicker { display: none; }
  .frame.phone .mock.rail .brand { grid-area: brand; font-size: 16px; }
  .frame.phone .mock.rail .acct-wrap { grid-area: acct; justify-self: end; }
  .frame.phone .mock.rail .replay button { flex: 1; min-width: 0; }
  .frame.phone .mock.rail .search { min-width: 0; }
  .frame.phone .mock.rail .vol { min-width: 0; }
  .frame.phone .mock.rail .vol input { width: 72px; flex: none; }
  .frame.phone .mock.rail .now { grid-area: now; min-width: 0; }
  .frame.phone .mock.rail .end { grid-area: end; }
  .frame.phone .mock.rail .replay { grid-area: replay; }
  .frame.phone .mock.rail .search { grid-area: search; width: 100%; }
  .frame.phone .mock.rail .vol { grid-area: vol; }
  .frame.phone .mock.rail .vol input { flex: 1; }
  .frame.phone .mock.rail .body { display: flex; flex-direction: column; }
  .frame.phone .mock.rail .fstrip { border-bottom: 1px solid #e5e7eb; background: #fff; }
  .frame.phone .mock.rail .frow { display: flex; gap: 4px; overflow-x: auto; padding: 4px 8px; }
  .frame.phone .mock.rail .chip { width: auto; margin: 0; flex: none; min-height: 36px; }
  .frame.phone .mock.rail .fam, .frame.phone .mock.rail .sensor, .frame.phone .mock.rail .dropbtn {
    border: 1px solid #d0d5dd; border-radius: 999px; padding: 6px 8px; background: #fff; min-height: 36px;
  }
  .frame.phone .mock.rail .sensor, .frame.phone .mock.rail .dropbtn { flex: none; }
  .frame.phone .mock.rail .fam.on { background: #111; color: #fff; border-color: #111; }
  .frame.phone .mock.rail .game { min-height: 52px; }
  .frame.phone .mock.rail .main { display: flex; flex-direction: column; min-height: 0; flex: 1; }

  /* ---------- Dock ---------- */
  .mock.dock { background: #0e1013; color: #eceae4; display: flex; flex-direction: column; }
  .mock.dock header, .mock.dock .fstrip, .mock.dock .dockbar, .mock.dock .listhead { border-color: #2a2e35; }
  .mock.dock header { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #2a2e35; position: relative; }
  .mock.dock .brand { font-size: 12px; letter-spacing: 0.18em; font-weight: 700; }
  .mock.dock .search { flex: 1; min-width: 0; background: #171a1f; border: 1px solid #2a2e35; color: #eceae4; padding: 8px 10px; }
  .mock.dock .acct { border: 1px solid #2a2e35; padding: 7px 10px; }
  .mock.dock .menu { background: #171a1f; border: 1px solid #2a2e35; }
  .mock.dock .fstrip { border-bottom: 1px solid #2a2e35; }
  .mock.dock .frow { display: flex; gap: 4px; overflow-x: auto; padding: 6px 8px; align-items: center; }
  .mock.dock .chip, .mock.dock .fam, .mock.dock .sensor, .mock.dock .dropbtn {
    flex: none; border: 1px solid #2a2e35; padding: 5px 8px; color: #eceae4; display: inline-flex; gap: 6px; align-items: center;
  }
  .mock.dock .chip.on, .mock.dock .fam.on, .mock.dock .replay button.on { background: #f5b942; color: #1a1203; border-color: #f5b942; }
  .mock.dock .chip .n { color: #9aa1ab; font-size: 12px; }
  .mock.dock .chip.on .n { color: #1a1203; }
  .mock.dock .hint { color: #9aa1ab; font-size: 12px; padding-left: 6px; }
  .mock.dock .main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .mock.dock .listhead { display: flex; gap: 8px; padding: 6px 10px; color: #9aa1ab; font-size: 12px; border-bottom: 1px solid #2a2e35; }
  .mock.dock .pill { border: 1px solid #3a404a; padding: 2px 6px; color: #f5b942; }
  .mock.dock .game { padding: 8px 10px; border-bottom: 1px solid #1c2026; color: #eceae4; }
  .mock.dock .game .meta { color: #9aa1ab; font-size: 12px; }
  .mock.dock .game .sys { color: #f5b942; font-size: 12px; letter-spacing: 0.04em; }
  .mock.dock .game.run { box-shadow: inset 2px 0 0 #f5b942; }
  .mock.dock .game.run .gt { color: #f5b942; }
  .mock.dock .game.kbd { background: #2a313c; }
  .mock.dock .dockbar { border-top: 1px solid #2a2e35; padding: 8px 10px; display: grid; gap: 8px; background: #121418; }
  .mock.dock .dock-top { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .mock.dock .dock-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mock.dock.is-run .dock-title { color: #f5b942; font-weight: 700; }
  .mock.dock .end { border: 1px solid #f5b942; color: #f5b942; padding: 6px 10px; }
  .mock.dock .replay { display: flex; gap: 4px; }
  .mock.dock .replay button { flex: 1; border: 1px solid #2a2e35; padding: 8px 4px; }
  .mock.dock .vol { display: flex; gap: 8px; align-items: center; }
  .mock.dock .vol input { flex: 1; }
  .mock.dock .vol button, .mock.dock .keys { color: #9aa1ab; }
  .mock.dock .keys { border-top: 1px solid #2a2e35; }
  .frame.desktop .mock.dock.is-run .dockbar { grid-template-columns: minmax(160px, 1.1fr) minmax(280px, 1.5fr) minmax(200px, 1fr); align-items: center; }
  .frame.desktop .mock.dock.is-idle .dockbar { grid-template-columns: 1fr minmax(240px, 360px); align-items: center; }
  .frame.phone .mock.dock .game { min-height: 52px; }
  .frame.phone .mock.dock .chip, .frame.phone .mock.dock .fam { min-height: 36px; }

  /* ---------- Lens ---------- */
  .mock.lens { background: #f6f1e7; color: #221e18; display: flex; flex-direction: column; font-family: Georgia, "Iowan Old Style", serif; }
  .mock.lens button, .mock.lens input, .mock.lens .keys, .mock.lens .meta, .mock.lens .listhead { font-family: "Segoe UI", "Helvetica Neue", sans-serif; }
  .mock.lens header { padding: 8px 12px; border-bottom: 1px solid #e4dccb; position: relative; }
  .mock.lens .brandline { display: flex; gap: 10px; align-items: center; }
  .mock.lens .brand { font-weight: 700; letter-spacing: 0.12em; font-size: 14px; font-family: "Segoe UI", sans-serif; }
  .mock.lens .search { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid #1d4e3a; background: transparent; padding: 6px 2px; border-radius: 0; }
  .mock.lens .acct, .mock.lens .sensor, .mock.lens .dropbtn { border: 1px solid #cfc3ae; padding: 6px 8px; background: transparent; }
  .mock.lens .vol { display: flex; align-items: center; gap: 6px; }
  .mock.lens .tabs { display: flex; gap: 0; overflow-x: auto; margin-top: 8px; }
  .mock.lens .fam { flex: none; border: 1px solid transparent; border-bottom: 0; padding: 7px 12px; color: #5c564c; }
  .mock.lens .fam.on { background: #fff; color: #1d4e3a; border-color: #e4dccb; font-weight: 650; }
  .mock.lens .sub { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e4dccb; }
  .mock.lens .sub .frow { display: flex; gap: 6px; align-items: center; overflow-x: auto; min-width: 0; }
  .mock.lens .chip { flex: none; display: inline-flex; gap: 6px; align-items: center; border: 1px solid #e4dccb; padding: 5px 8px; background: #fff; }
  .mock.lens .chip.on { background: #1d4e3a; color: #f6f1e7; border-color: #1d4e3a; }
  .mock.lens .chip .n { font-size: 12px; opacity: 0.7; }
  .mock.lens .hint { font-size: 12px; color: #5c564c; }
  .mock.lens .band { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1d4e3a; color: #f6f1e7; }
  .mock.lens .band .who { flex: 1; min-width: 0; }
  .mock.lens .band .who strong { display: block; font-family: Georgia, serif; font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mock.lens .band .who span, .mock.lens .replay button, .mock.lens .end { font-family: "Segoe UI", sans-serif; font-size: 13px; }
  .mock.lens .replay { display: flex; gap: 4px; flex-wrap: wrap; }
  .mock.lens .replay button, .mock.lens .end { border: 1px solid rgba(246,241,231,.45); color: #f6f1e7; padding: 6px 8px; }
  .mock.lens .replay button.on { background: #f6f1e7; color: #1d4e3a; }
  .mock.lens .main { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; }
  .mock.lens .listhead { display: flex; gap: 8px; padding: 6px 12px; color: #5c564c; font-size: 12px; }
  .mock.lens .cols, .mock.lens .game.table {
    display: grid; grid-template-columns: minmax(0, 1.6fr) 90px 54px minmax(70px, 0.7fr); gap: 8px; align-items: center;
  }
  .mock.lens .cols { padding: 4px 12px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8174; border-bottom: 1px solid #e4dccb; }
  .mock.lens .game { padding: 8px 12px; border-bottom: 1px solid #f0e9dc; background: #fff; }
  .mock.lens .game.run { background: #eef5f1; }
  .mock.lens .game.run .gt { color: #1d4e3a; font-weight: 700; }
  .mock.lens .game.kbd { outline: 1px solid #1d4e3a; outline-offset: -1px; }
  .mock.lens .menu { background: #fff; border: 1px solid #e4dccb; }
  .mock.lens .keys { color: #5c564c; border-top: 1px solid #e4dccb; }
  .mock.lens .pill { border-bottom: 1px solid #1d4e3a; padding: 0; }
  .frame.desktop .mock.lens .vol { flex: none; }
  .frame.desktop .mock.lens .vol input { width: 88px; }
  .frame.phone .frow.fams .fam { flex: 1 1 auto; text-align: center; justify-content: center; }
  .frame.phone .mock.lens .brandline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
  .frame.phone .mock.lens .vol { margin-top: 8px; }
  .frame.phone .mock.lens .vol input { flex: 1; width: auto; }
  .frame.phone .mock.lens .band {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px;
    grid-template-areas: "who end" "replay replay";
  }
  .frame.phone .mock.lens .who { grid-area: who; }
  .frame.phone .mock.lens .end { grid-area: end; width: auto; }
  .frame.phone .mock.lens .replay { grid-area: replay; }
  .frame.phone .mock.lens .cols { display: none; }
  .frame.phone .mock.lens .game.table { display: block; min-height: 52px; }
  .frame.phone .mock.lens .game .meta { display: block; color: #5c564c; font-size: 12px; margin-top: 2px; }
  .frame.phone .mock.lens .replay button { flex: 1; min-width: 0; }
  .frame.phone .mock.lens .tabs .dropbtn { margin-left: auto; flex: none; border: 1px solid #cfc3ae; padding: 6px 8px; }

  /* ---------- Session ---------- */
  .mock.session {
    --bg: #f7f3f1;
    --surface: #fff;
    --ink: #2a1816;
    --muted: #7a6560;
    --line: #eadfdc;
    --row: #f0e6e3;
    --accent: #9f2b2b;
    --wash: #fdf1ee;
    --end-line: #f0c9c2;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  }
  .mock.session.night {
    --bg: #140e0d;
    --surface: #221716;
    --ink: #f4ebe7;
    --muted: #c0a8a2;
    --line: #3d2c29;
    --row: #4a3532;
    --accent: #e15b4c;
    --wash: #3a221f;
    --end-line: #6e3a34;
  }
  .mock.session header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; }
  .mock.session .brand { font-weight: 760; letter-spacing: 0.08em; font-size: 14px; color: var(--accent); }
  .mock.session .search { flex: 1; min-width: 0; border: 1px solid var(--line); padding: 7px 10px; background: var(--surface); color: var(--ink); }
  .mock.session .acct { border: 1px solid var(--line); padding: 6px 10px; background: var(--surface); }
  .mock.session .theme {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 36px; height: 36px; padding: 0; border: 1px solid var(--line);
    background: var(--surface); color: var(--accent);
  }
  .mock.session .menu { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .mock.session .workspace { flex: 1; min-height: 0; display: grid; }
  .mock.session .primary { min-height: 0; display: flex; flex-direction: column; }
  .mock.session .fstrip { background: var(--surface); border-bottom: 1px solid var(--line); }
  .mock.session .frow { display: flex; gap: 4px; overflow-x: auto; padding: 6px 8px; align-items: center; }
  .mock.session .chip, .mock.session .fam, .mock.session .sensor {
    flex: none; border: 1px solid var(--line); background: var(--surface); padding: 5px 8px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink);
  }
  .mock.session .chip.on, .mock.session .fam.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mock.session .chip .n { font-size: 12px; opacity: 0.7; }
  .mock.session .hint { font-size: 12px; color: var(--muted); }
  .mock.session .listhead { display: flex; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
  .mock.session .game { padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--row); color: var(--ink); }
  .mock.session .game .meta, .mock.session .game .sys { color: var(--muted); font-size: 12px; }
  .mock.session .game .sys { color: var(--accent); }
  .mock.session .game.run { background: var(--wash); }
  .mock.session .game.run .gt { font-weight: 700; color: var(--accent); }
  .mock.session .game.kbd { box-shadow: inset 3px 0 0 var(--accent); }
  .mock.session .panel { background: var(--surface); min-height: 0; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .mock.session .panel .kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .mock.session .panel h2 { font-size: 22px; line-height: 1.2; margin: 0; font-weight: 680; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mock.session .panel .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game .gt { min-width: 0; }
  .game .gt > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
const GAMES = [

const CONCEPTS = [
  {
    id: "rail",
    name: "Rail",
    thesis: "Filters stay on screen. Desktop keeps today’s full sidebar. A phone turns that sidebar into two scrolling rows, not a drawer that covers the list.",
    mobile: "Idle gives the replay row back to the list. Running keeps stop, play, end, record, and resume in the header. Volume is a slider, not a popup. Search, account, sensor, and ROM drop stay one tap away."
  },
  {
    id: "dock",
    name: "Dock",
    thesis: "The session lives at the bottom edge, where a thumb rests. The top of the screen is only search, account, and filters.",
    mobile: "With no game, the dock is one row: status, volume, mute, and ROM drop. While a game runs it grows to the title, stop, and four replay actions. The list keeps whatever space is left."
  },
  {
    id: "lens",
    name: "Lens",
    thesis: "The exclusivity rule is the navigation. One tab is the active family. Orientation is a separate switch and never changes the tab.",
    mobile: "Tabs scroll sideways instead of stacking. The catalog becomes stacked rows. A running game adds one band that holds stop and replay; idle omits that band so the list gets it."

  {

    name: "Session",
    thesis: "The running game is a panel, not a crumb. Desktop puts labeled replay controls, volume, and stop on the right. The list and filters use the left.",

const ICONS = {
  landscape: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="7" width="18" height="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  portrait: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="7" y="3" width="10" height="18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0c-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0c-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41a.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>',
  moon: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>',
  record: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>',
  resume: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2.5 11h8v2h-8zM11.5 6.5h2v11h-2z"/><circle cx="18.6" cy="12" r="3.15" fill="currentColor"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
};

const state = {
  concept: "rail",
  viewport: "desktop",
  preset: "running",
  running: "longtitle",
  search: "",
  orientation: "landscape",
  family: "genre",
  picked: ["Shooter"],
  volume: 42,
  preMute: 42,
  menu: false,
  drop: false,
  replay: "",
  kbd: 0,
  sessionOpen: true,
  night: false,
  busy: false,
  toast: ""
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function options(group) {
  const values = group === "orientation"
    ? ["landscape", "portrait"]
    : group === "genre"
      ? [...new Set(GAMES.flatMap((g) => g.genres))]
      : group === "tag"
        ? [...new Set(GAMES.flatMap((g) => g.tags))]
        : group === "series"
          ? [...new Set(GAMES.map((g) => g.series).filter(Boolean))]
          : [...new Set(GAMES.map((g) => g.system))];
  return values.sort((a, b) => a.localeCompare(b)).map((name) => ({
    name,
    count: GAMES.filter((g) => matchGroup(g, group, [name])).length
  }));
}
function matchGroup(g, group, picked) {
  if (group === "orientation") return g.orientation === picked[0];
  if (group === "system") return g.system === picked[0];
  if (group === "genre") return g.genres.includes(picked[0]);
  if (group === "series") return g.series === picked[0];
  if (group === "tag") return picked.every((t) => g.tags.includes(t));
  return true;
}
function shown() {
  return GAMES.filter((g) => {
    if (state.search && !g.title.toLowerCase().includes(state.search.toLowerCase())) return false;
    if (state.orientation && g.orientation !== state.orientation) return false;
    if (state.family && state.picked.length && !matchGroup(g, state.family, state.picked)) return false;
    return true;
  }).sort((a, b) => a.title.localeCompare(b.title));
}
function runningGame() {
  return GAMES.find((g) => g.id === state.running) || null;
}
function applyPreset(name) {
  state.preset = name;
  state.search = "";
  state.menu = false;
  state.drop = false;
  state.replay = "";
  state.kbd = 0;
  state.sessionOpen = true;
  state.toast = "";
  state.volume = 42;
  state.preMute = 42;
  if (name === "running") {
    state.running = "longtitle";
    state.orientation = "landscape";
    state.family = "genre";
    state.picked = ["Shooter"];
  } else {
    state.running = null;
    state.orientation = null;
    state.family = null;
    state.picked = [];
  }
}
function ruleText() {
  const ori = state.orientation ? `Orientation is ${state.orientation} and stays put.` : "Orientation is unset.";
  if (!state.family || !state.picked.length) {
    return `${ori} No system, genre, tag, or series is selected.`;
  }
  const label = FAMILIES.find((f) => f.id === state.family).label;
  return `${ori} ${label} is ${state.picked.join(" + ")}. System, genre, tag, and series replace one another.`;
}
function chip(group, name, count, on) {
  const icon = group === "orientation" ? ICONS[name] : "";
  return `<button type="button" class="chip${on ? " on" : ""}" data-act="filter" data-group="${group}" data-name="${esc(name)}" aria-pressed="${on}"><span class="ic">${icon}</span><span>${esc(name)}</span><span class="n">${count}</span></button>`;
}
function oriChips() {
  return options("orientation").map((o) => chip("orientation", o.name, o.count, state.orientation === o.name)).join("");
}
function familyChips(id) {
  return options(id).map((o) => chip(id, o.name, o.count, state.family === id && state.picked.includes(o.name))).join("");
}
function familyButtons() {
  return FAMILIES.map((f) => {
    const on = state.family === f.id;
    return `<button type="button" class="fam${on ? " on" : ""}" data-act="family" data-name="${f.id}" aria-pressed="${on}">${f.label}</button>`;
  }).join("");
}
function sensorBtn() {
  return `<button type="button" class="sensor" data-act="sensor" title="Sensor reads landscape. Sets orientation and leaves the other filter alone.">Sensor</button>`;
}
function pills() {
  const bits = [];
  if (state.orientation) bits.push(`<button type="button" class="pill" data-act="clear-ori">${esc(state.orientation)} ×</button>`);
  if (state.family && state.picked.length) {
    bits.push(`<button type="button" class="pill" data-act="clear-family">${esc(state.picked.join(" + "))} ×</button>`);
  }
  return bits.join("");
}
function gameRows(variant) {
  const rows = shown();
  if (!rows.length) return `<div class="listhead">No titles match.</div>`;
  return rows.map((g, i) => {
    const on = state.running === g.id;
    const cls = ["game", variant === "table" ? "table" : "", on ? "run" : "", state.kbd === i ? "kbd" : ""].filter(Boolean).join(" ");
    const ori = state.orientation ? "" : ICONS[g.orientation];
    const sys = state.family === "system" ? "" : `<span class="sys">${esc(g.system)}</span>`;
    if (variant === "table" && state.viewport === "desktop") {
      return `<button type="button" class="${cls}" data-act="launch" data-id="${g.id}"><span class="gt">${ori}<span>${esc(g.title)}</span></span>${sys || "<span></span>"}<span>${g.year}</span><span>${esc(g.company)}</span></button>`;
    }
    const meta = [g.year, g.company].join(" · ");
    return `<button type="button" class="${cls}" data-act="launch" data-id="${g.id}"><span class="gt">${ori}<span>${esc(g.title)}</span>${sys}</span><span class="meta">${esc(meta)}</span></button>`;
  }).join("");
}
function listHead() {
  return `<div class="listhead"><span>${shown().length} titles</span>${pills()}</div>`;
}
function searchEl() {
  return `<input id="q" class="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search titles" value="${esc(state.search)}">`;
}
function volEl() {
  const mute = state.volume === 0 ? "Unmute" : "Mute";
  return `<div class="vol"><input id="vol" type="range" min="0" max="100" value="${state.volume}" aria-label="Volume"><span data-vol-label>${state.volume}%</span><button type="button" data-act="mute">${mute}</button></div>`;
}
function accountEl() {
  const menu = state.menu ? `<div class="menu" data-act="menu-panel"><button type="button" data-act="signout">Sign out</button></div>` : "";
  return `<div class="acct-wrap"><button type="button" class="acct" data-act="menu" aria-expanded="${state.menu}">Account</button>${menu}</div>`;
}
function sessionReplay(phone) {
  if (!state.running) return "";
  const items = [
    ["play", "Play", "Play replay", ICONS.play],
    ["end", "End", "End replay", ICONS.stop],
    ["record", "Record", "Record replay", ICONS.record],
    ["resume", "Resume", "Resume recording", ICONS.resume]
  ];
  return `<div class="replay">${items.map(([id, label, title, icon]) => `<button type="button" data-act="replay" data-name="${id}" class="${state.replay === id ? "on" : ""}" title="${esc(title)}" aria-label="${esc(title)}">${icon}${phone ? "" : `<span>${label}</span>`}</button>`).join("")}</div>`;
}
function replayEl(labels) {
  if (!state.running) return "";
  const items = [
    ["play", labels[0]],
    ["end", labels[1]],
    ["record", labels[2]],
    ["resume", labels[3]]
  ];
  return `<div class="replay">${items.map(([id, label]) => `<button type="button" data-act="replay" data-name="${id}" class="${state.replay === id ? "on" : ""}" title="${esc(label)}">${esc(label)}</button>`).join("")}</div>`;
}
function endBtn(label) {
  if (!state.running) return "";
  return `<button type="button" class="end" data-act="stop">${label}</button>`;
}
function stopIconBtn() {
  if (!state.running) return "";
  return `<button type="button" class="end end-icon" data-act="stop" aria-label="Stop game" title="Stop game">${ICONS.close}</button>`;
}
function overlays() {
  const busy = state.busy ? `<div class="scrim"><span>Launching</span></div>` : "";
  const drop = state.drop && state.concept !== "session" ? `<div class="drop"><button type="button" class="well" data-act="drop-dismiss">Drop ROMs here</button></div>` : "";
  const toast = state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "";
  return busy + drop + toast;
}
function keys() {
  return `<div class="keys">t search · n/p move · enter launch · m mute · −/= volume · esc close</div>`;
}
function phoneStrip(extra) {
  const hint = state.family === "tag" ? '<span class="hint">Tags combine</span>' : "";
  const chips = state.family ? `<div class="frow">${familyChips(state.family)}${hint}</div>` : "";
  if (state.viewport === "phone") {
    return `<div class="fstrip"><div class="frow">${oriChips()}${sensorBtn()}</div><div class="frow fams">${familyButtons()}${extra || ""}</div>${chips}</div>`;
  }
  return `<div class="fstrip"><div class="frow">${oriChips()}${sensorBtn()}${familyButtons()}${extra || ""}</div>${chips}</div>`;
}

function renderRail() {
  const phone = state.viewport === "phone";
  const filters = phone
    ? phoneStrip(`<button type="button" class="dropbtn" data-act="drop">Drop ROMs</button>`)
    : `<aside><div class="groups"><div class="grp"><div class="lbl">Orientation</div>${options("orientation").map((o) => chip("orientation", o.name, o.count, state.orientation === o.name)).join("")}${sensorBtn()}</div>${FAMILIES.map((f) => `<div class="grp"><div class="lbl">${f.label}</div>${familyChips(f.id)}${f.id === "tag" ? '<div class="hint">Tags combine. Another family clears them.</div>' : ""}</div>`).join("")}</div><button type="button" class="dropbtn" data-act="drop">Drop ROMs</button></aside>`;
  return `<div class="mock rail is-${state.running ? "run" : "idle"}">
    <header>
      <div class="brand">RED</div>
      <div class="now"><div class="kicker">${state.running ? "Running" : "No game"}</div><div class="title">${state.running ? esc(runningGame().title) : "Nothing running"}</div></div>
      ${replayEl(["Play", "End", "Record", "Resume"])}
      ${endBtn("Stop")}
      ${searchEl()}
      ${volEl()}
      ${accountEl()}
    </header>
    <div class="body">${filters}<div class="main">${listHead()}<div class="list">${gameRows("row")}</div></div></div>
    ${keys()}${overlays()}
  </div>`;
}
function renderDock() {
  const game = runningGame();
  const dock = game
    ? `<div class="dock-top"><div class="dock-title">${esc(game.title)} · ${esc(game.system)}</div>${endBtn("Stop")}</div>${replayEl(["Play", "End", "Record", "Resume"])}${volEl()}`
    : `<div class="dock-top"><div class="dock-title">No game running</div><button type="button" class="dropbtn" data-act="drop">Drop ROMs</button></div>${volEl()}`;
  const drop = game ? `<button type="button" class="dropbtn" data-act="drop">Drop ROMs</button>` : "";
  return `<div class="mock dock is-${game ? "run" : "idle"}">
    <header><div class="brand">RED</div>${searchEl()}${accountEl()}</header>
    ${phoneStrip(drop)}
    <div class="main">${listHead()}<div class="list">${gameRows("row")}</div></div>
    <div class="dockbar">${dock}</div>
    ${keys()}${overlays()}
  </div>`;
}
function renderLens() {
  const game = runningGame();
  const cols = state.viewport === "desktop" ? `<div class="cols"><span>Title</span><span>System</span><span>Year</span><span>Company</span></div>` : "";
  const band = game ? `<div class="band"><div class="who"><span>Running</span><strong>${esc(game.title)}</strong></div>${endBtn("Stop")}${replayEl(["Play", "End", "Record", "Resume"])}</div>` : "";
  const chipRow = state.family ? familyChips(state.family) : `<span class="hint">Pick a family. Orientation can stay on.</span>`;
  const phone = state.viewport === "phone";
  const drop = `<button type="button" class="dropbtn" data-act="drop" title="Drop ROMs to upload">${phone ? "Drop" : "Drop ROMs"}</button>`;
  const top = phone
    ? `<div class="brandline"><div class="brand">RED</div>${searchEl()}${accountEl()}</div>${volEl()}`
    : `<div class="brandline"><div class="brand">RED</div>${searchEl()}${volEl()}${accountEl()}</div>`;
  return `<div class="mock lens is-${game ? "run" : "idle"}">
    <header>
      ${top}
      <div class="tabs"><button type="button" class="fam${state.family ? "" : " on"}" data-act="family-all" aria-pressed="${!state.family}">All</button>${familyButtons()}${phone ? drop : ""}</div>
    </header>
    <div class="sub"><div class="frow">${oriChips()}${sensorBtn()}${phone ? "" : drop}</div><div class="frow">${chipRow}${state.family === "tag" ? '<span class="hint">Tags combine</span>' : ""}</div></div>
    ${band}
    <div class="main">${listHead()}${cols}<div class="list">${gameRows("table")}</div></div>
    ${keys()}${overlays()}
  </div>`;
}
function renderSession() {
  const game = runningGame();
  const phone = state.viewport === "phone";
  let panel;
  const fold = `<button type="button" class="collapse" data-act="session">${state.sessionOpen ? "Collapse" : "Expand"}</button>${stopIconBtn()}`;
  if (phone && !state.sessionOpen) {
    const label = game ? game.title : "No game";
    panel = `<div class="collapsed"><button type="button" class="toggle" data-act="session"><strong title="${esc(label)}">${esc(label)}</strong><span>${state.volume}%</span></button><div class="card-actions">${fold}</div></div>`;
  } else {
    const body = game
      ? `<div class="kicker">Running</div><h2 title="${esc(game.title)}">${esc(game.title)}</h2><div class="meta">${esc(game.system)} · ${game.year} · ${esc(game.company)} · ${esc(game.orientation)}</div>${sessionReplay(phone)}${phone ? "" : endBtn("Stop game")}`
      : `<div class="kicker">Idle</div><h2>No game running</h2><div class="meta">Choose a title. The sensor can still set orientation.</div>`;
    const actions = phone ? `<div class="card-actions">${fold}</div>` : "";
    panel = `<section class="panel">${actions}${body}${volEl()}</section>`;
  }
  const theme = `<button type="button" class="theme" data-act="theme" aria-pressed="${state.night}" aria-label="${state.night ? "Switch to day" : "Switch to night"}" title="${state.night ? "Day" : "Night"}">${state.night ? ICONS.moon : ICONS.sun}</button>`;
  return `<div class="mock session ${state.night ? "night" : "day"} is-${game ? "run" : "idle"}">
    <header><div class="brand">RED</div>${searchEl()}${theme}${accountEl()}</header>
    <div class="workspace">
      ${phone ? panel : ""}
      <div class="primary">${phoneStrip()}<div class="main">${listHead()}<div class="list">${gameRows("row")}</div></div></div>
      ${phone ? "" : panel}
    </div>
    ${keys()}${overlays()}
  </div>`;
}

const RENDER = { rail: renderRail, dock: renderDock, lens: renderLens, session: renderSession };

function page() {
  const concept = CONCEPTS.find((c) => c.id === state.concept);
  const tabs = CONCEPTS.map((c) => `<button type="button" data-act="concept" data-name="${c.id}" aria-pressed="${c.id === state.concept}">${c.name}</button>`).join("");
  const vp = ["desktop", "phone"].map((v) => `<button type="button" data-act="viewport" data-name="${v}" aria-pressed="${state.viewport === v}">${v === "desktop" ? "Desktop" : "Phone"}</button>`).join("");
  const presets = ["idle", "running"].map((p) => `<button type="button" data-act="preset" data-name="${p}" aria-pressed="${state.preset === p}">${p === "idle" ? "No game" : "Game running"}</button>`).join("");
  return `<h1>RED launcher concepts</h1>
    <p class="lede">Four layouts for the same launcher. Orientation can stay on while you pick something else. Choosing a system, genre, tag, or series clears the other three. Tags still combine with each other. Each layout has search, launch, stop, replay, volume, mute, account, ROM drop, the orientation sensor, and the same keyboard shortcuts.</p>
    <div class="controls"><div class="group" role="group" aria-label="Concept">${tabs}</div><div class="group" role="group" aria-label="Viewport">${vp}</div><div class="group" role="group" aria-label="State">${presets}</div></div>
    <p class="rule">${esc(ruleText())}</p>
    <div class="frame-label">${state.viewport === "phone" ? "Phone · 390px" : "Desktop · 1120px"} · ${state.preset === "running" ? "Game running" : "No game"}</div>
    <div class="frame ${state.viewport}">${RENDER[state.concept]()}</div>
    <div class="notes"><h2>${esc(concept.name)}</h2><p>${esc(concept.thesis)}</p><p>${esc(concept.mobile)}</p></div>`;
}

let preserve = null;
function render() {
  const topEl = document.querySelector(".list");
  const top = topEl ? topEl.scrollTop : 0;
  document.getElementById("gallery").innerHTML = page();
  if (preserve) {
    const el = document.getElementById(preserve.id);
    if (el) {
      el.focus();
      if (el.setSelectionRange) el.setSelectionRange(preserve.start, preserve.end);
    }
    preserve = null;
  }
  const list = document.querySelector(".list");
  if (list) list.scrollTop = top;
  document.querySelectorAll(".frow, .groups").forEach((row) => {
    const on = row.querySelector(".chip.on");
    if (!on) return;
    const edge = on.offsetLeft + on.offsetWidth + 12;
    if (edge > row.scrollLeft + row.clientWidth) row.scrollLeft = on.offsetLeft - 8;
  });
  const hash = `#${state.concept}/${state.viewport}/${state.preset}`;
  if (location.hash !== hash) history.replaceState(null, "", hash);
}

function selectFilter(group, name) {
  if (group === "orientation") {
    state.orientation = state.orientation === name ? null : name;
    return;
  }
  if (state.family !== group) {
    state.family = group;
    state.picked = [name];
    return;
  }
  if (group === "tag") {
    state.picked = state.picked.includes(name) ? state.picked.filter((x) => x !== name) : state.picked.concat(name);
    if (!state.picked.length) state.family = null;
    return;
  }
  if (state.picked[0] === name) {
    state.picked = [];
    state.family = null;
  } else {
    state.picked = [name];
  }
}

let toastTimer = 0;
function flash(text) {
  state.toast = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    state.toast = "";
    render();
  }, 1200);
}

document.getElementById("gallery").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  const act = el ? el.dataset.act : "";
  if (act === "menu-panel") return;
  const menuWas = state.menu;
  if (menuWas && act !== "menu" && act !== "signout") state.menu = false;
  if (act === "concept") {
    state.concept = el.dataset.name;
    if (state.concept === "session") state.drop = false;
  }
  else if (act === "viewport") state.viewport = el.dataset.name;
  else if (act === "theme") state.night = !state.night;
  else if (act === "preset") applyPreset(el.dataset.name);
  else if (act === "filter") selectFilter(el.dataset.group, el.dataset.name);
  else if (act === "family") {
    if (state.family === el.dataset.name) {
      state.family = null;
      state.picked = [];
    } else {
      state.family = el.dataset.name;
      state.picked = [];
    }
  } else if (act === "family-all") {
    state.family = null;
    state.picked = [];
  } else if (act === "clear-ori") state.orientation = null;
  else if (act === "clear-family") {
    state.family = null;
    state.picked = [];
  } else if (act === "sensor") state.orientation = "landscape";
  else if (act === "launch") {
    state.running = el.dataset.id;
    state.replay = "";
    state.busy = true;
    state.preset = "running";
    const rows = shown();
    state.kbd = Math.max(0, rows.findIndex((g) => g.id === el.dataset.id));
    render();
    setTimeout(() => { state.busy = false; render(); }, 400);
    return;
  } else if (act === "stop") {
    state.running = null;
    state.replay = "";
    state.preset = "idle";
  } else if (act === "replay") {
    state.replay = el.dataset.name;
    const names = { play: "Playing replay", end: "Replay ended", record: "Recording replay", resume: "Recording resumed" };
    flash(names[state.replay]);
  } else if (act === "mute") {
    if (state.volume > 0) {
      state.preMute = state.volume;
      state.volume = 0;
    } else {
      state.volume = state.preMute || 42;
    }
  } else if (act === "menu") state.menu = !menuWas;
  else if (act === "signout") {
    state.menu = false;
    flash("Signed out");
  } else if (act === "drop") state.drop = true;
  else if (act === "drop-dismiss") state.drop = false;
  else if (act === "session") state.sessionOpen = !state.sessionOpen;
  else if (!act && !menuWas) return;
  state.kbd = Math.min(state.kbd, Math.max(0, shown().length - 1));
  render();
});

document.getElementById("gallery").addEventListener("input", (e) => {
  if (e.target.id === "vol") {
    state.volume = Number(e.target.value);
    if (state.volume > 0) state.preMute = state.volume;
    document.querySelectorAll("[data-vol-label]").forEach((n) => { n.textContent = `${state.volume}%`; });
    const mute = document.querySelector("[data-act='mute']");
    if (mute) mute.textContent = state.volume === 0 ? "Unmute" : "Mute";
    return;
  }
  if (e.target.id === "q") {
    preserve = { id: "q", start: e.target.selectionStart, end: e.target.selectionEnd };
    state.search = e.target.value;
    state.kbd = 0;
    render();
  }
});

document.addEventListener("keydown", (e) => {
  const typing = e.target.id === "q";
  const rows = shown();
  if (e.key === "Escape") {
    if (state.drop || state.menu) {
      state.drop = false;
      state.menu = false;
      render();
    } else if (typing) {
      e.target.blur();
    } else {
      state.kbd = 0;
      render();
    }
    return;
  }
  if (typing) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      state.kbd = Math.max(0, Math.min(rows.length - 1, state.kbd + (e.key === "ArrowDown" ? 1 : -1)));
      render();
      const q = document.getElementById("q");
      if (q) q.focus();
    } else if (e.key === "Enter" && rows[state.kbd]) {
      e.preventDefault();
      state.running = rows[state.kbd].id;
      state.preset = "running";
      state.busy = true;
      render();
      setTimeout(() => { state.busy = false; render(); }, 400);
    }
    return;
  }
  const move = (d) => {
    if (!rows.length) return;
    state.kbd = Math.max(0, Math.min(rows.length - 1, state.kbd + d));
    render();
  };
  if (e.key === "t" || e.key === "/") {
    e.preventDefault();
    const q = document.getElementById("q");
    if (q) q.focus();
  } else if (e.key === "n" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "p" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if ((e.key === "Enter" || e.key === "o") && rows[state.kbd]) {
    state.running = rows[state.kbd].id;
    state.preset = "running";
    state.busy = true;
    render();
    setTimeout(() => { state.busy = false; render(); }, 400);
  } else if (e.key === "m") {
    document.querySelector("[data-act='mute']").click();
  } else if (e.key === "-" || e.key === "=") {
    const next = e.key === "-" ? Math.max(0, state.volume - (e.shiftKey ? 10 : 2)) : Math.min(100, state.volume + (e.shiftKey ? 10 : 2));
    state.volume = next;
    render();
  }
});

const hash = location.hash.replace("#", "").split("/");
if (CONCEPTS.some((c) => c.id === hash[0])) state.concept = hash[0];
if (hash[1] === "phone" || hash[1] === "desktop") state.viewport = hash[1];
if (hash[2] === "idle" || hash[2] === "running") applyPreset(hash[2]);
render();
</script>
</body>
</html>
